[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssh-vps-mcp"
version = "0.1.0"
description = "MCP server for remote VPS management via SSH key authentication — designed for Claude Code"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Lema Core Technologies", email = "dev@lemacore.com" }
]
keywords = ["mcp", "ssh", "vps", "claude", "claude-code", "remote"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
requires-python = ">=3.10"

dependencies = [
    "mcp[cli]>=1.0.0",
    "paramiko>=3.4.0",
]

[project.scripts]
ssh-vps-mcp = "vps_mcp.__main__:main"

[project.urls]
Homepage = "https://lemacore.com"
Repository = "https://github.com/aldirrss/vps-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/vps_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "README.md",
    "LICENSE",
]
